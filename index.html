<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — World Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile fallback -->
  <div class="mobile-block">
    <p>Best experienced on desktop</p>
  </div>

  <!-- Ocean / map stage -->
  <div id="map">

    <!--
      ┌─────────────────────────────────────────────────┐
      │  BACKGROUND SWAP                                │
      │  Drop your artwork at:                          │
      │    assets/map/background.png                    │
      │  It will automatically replace the CSS ocean.   │
      │  Recommended size: 1920×1080px (or larger).     │
      │  Must have a transparent-friendly format (PNG). │
      └─────────────────────────────────────────────────┘
    -->
    <div id="map-bg"></div>

    <!-- Dotted paths (SVG) -->
    <svg id="paths-svg" xmlns="http://www.w3.org/2000/svg">
      <!-- Paths injected by script.js -->
    </svg>

    <!-- Clouds (injected by script.js) -->
    <div id="clouds-layer"></div>

    <!-- Regions (injected by script.js) -->
    <div id="regions-layer"></div>

  </div>

  <!-- PDF overlay panel -->
  <div id="pdf-overlay" aria-hidden="true">
    <div id="pdf-panel">
      <div id="pdf-topbar">
        <div id="pdf-title">
          <span id="pdf-region-name"></span>
          <span id="pdf-region-desc"></span>
        </div>
        <button id="pdf-close" aria-label="Close">✕</button>
      </div>
      <iframe id="pdf-frame" title="Portfolio PDF" src=""></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
